<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zipline Generator — The Travel Agency DTBK</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#222; --border:#2e2e2e;
      --text:#f0f0f0; --muted:#888; --accent:#c8f55a; --accent-dim:rgba(200,245,90,0.1);
      --success:#4caf7d; --danger:#e05c5c; --radius:10px;
      --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      --mono:'JetBrains Mono','Fira Code','Courier New',monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;padding:2rem 1rem;}
    .container{max-width:820px;margin:0 auto;}
    header{display:flex;align-items:baseline;gap:12px;margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);}
    header h1{font-size:18px;font-weight:600;letter-spacing:-0.02em;}
    header span{font-size:12px;color:var(--muted);}
    .accent-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;}
    .section-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:10px;}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;}
    .upload-zone{display:flex;align-items:center;gap:10px;cursor:pointer;border:1px dashed var(--border);border-radius:8px;padding:10px 12px;transition:border-color .2s,background .2s;}
    .upload-zone:hover{border-color:var(--accent);background:var(--accent-dim);}
    .upload-zone.done{border-color:var(--success);border-style:solid;}
    .upload-icon{font-size:18px;opacity:.5;}
    .upload-zone.done .upload-icon{opacity:1;}
    .upload-name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .upload-zone.done .upload-name{color:var(--success);}
    label.field-label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
    input[type="number"],input[type="text"],textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--font);font-size:13px;padding:8px 10px;outline:none;transition:border-color .15s;}
    input:focus,textarea:focus{border-color:var(--accent);}
    textarea{resize:vertical;min-height:60px;line-height:1.5;}
    .section{margin-bottom:1.25rem;}
    button{background:var(--accent);color:#0f0f0f;border:none;border-radius:8px;font-family:var(--font);font-size:13px;font-weight:600;padding:10px 18px;cursor:pointer;transition:opacity .15s,transform .1s;}
    button:hover{opacity:.88;}
    button:active{transform:scale(.98);}
    button:disabled{opacity:.3;cursor:not-allowed;transform:none;}
    button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);font-weight:500;}
    button.secondary:hover{border-color:var(--muted);}
    .btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
    .stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
    .stat-val{font-size:20px;font-weight:600;letter-spacing:-0.02em;color:var(--accent);}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:2px;}
    .message-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
    .message-section-header{color:var(--accent);font-weight:600;}
    .debug-box{background:#080808;border:1px solid #222;border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:11px;line-height:1.9;white-space:pre-wrap;color:#666;max-height:280px;overflow-y:auto;}
    .dok{color:var(--success);} .derr{color:var(--danger);} .dwarn{color:#f0a500;}
    .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-size:13px;display:none;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4);}
    .toast.success{border-color:var(--success);color:var(--success);}
    .toast.error{border-color:var(--danger);color:var(--danger);}
    .divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0;}
    #output{display:none;}
    .output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px;}
    @media(max-width:600px){.grid-2,.grid-4{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1><span class="accent-dot"></span>Zipline Generator</h1>
    <span>The Travel Agency — Soho</span>
  </header>

  <div class="section">
    <p class="section-label">Reports</p>
    <div class="grid-2">
      <div class="card">
        <p class="section-label" style="margin-bottom:8px;">Closing Report</p>
        <label class="upload-zone" id="cr-zone">
          <span class="upload-icon">📊</span>
          <span class="upload-name" id="cr-name">Upload closing_report.xlsx</span>
          <input type="file" accept=".xlsx" id="cr-input" style="display:none">
        </label>
      </div>
      <div class="card">
        <p class="section-label" style="margin-bottom:8px;">Fee &amp; Donation Report</p>
        <label class="upload-zone" id="fd-zone">
          <span class="upload-icon">📋</span>
          <span class="upload-name" id="fd-name">Upload fee_donation.xlsx</span>
          <input type="file" accept=".xlsx" id="fd-input" style="display:none">
        </label>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-label">Goals</p>
    <div class="card">
      <div class="grid-2">
        <div>
          <label class="field-label">Weekly goal ($)</label>
          <input type="number" id="weekly-goal" value="580000">
        </div>
        <div>
          <label class="field-label">Today's goal ($)</label>
          <input type="number" id="daily-goal" value="60000">
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <p class="section-label">Message Content</p>
    <div class="card" style="display:flex;flex-direction:column;gap:12px;">
      <div>
        <label class="field-label">Team shoutouts (extra — FF signups auto-added)</label>
        <textarea id="field-shoutouts" placeholder="e.g. Andrew and Amir for 5★ Google Reviews"></textarea>
      </div>
      <div class="grid-2">
        <div>
          <label class="field-label">Focus areas</label>
          <textarea id="field-focus">- ensure complete customer care
- Double check IDs at the register</textarea>
        </div>
        <div>
          <label class="field-label">Inventory updates</label>
          <textarea id="field-inventory">- ensure all products are scannable
- make sure all products are stocked properly</textarea>
        </div>
      </div>
      <div>
        <label class="field-label">Cash updates</label>
        <textarea id="field-cash">- make sure all cash drops are entered on the paper and in the cash tracker
- remember for cash transactions select "Cash" for debit transactions hit "Debit"</textarea>
      </div>
    </div>
  </div>

  <button id="generate-btn" disabled style="width:100%;padding:12px;font-size:14px;margin-bottom:1.5rem;">
    Generate Zipline Message
  </button>

  <div id="output">
    <hr class="divider">
    <div class="section">
      <p class="section-label">Yesterday's Numbers</p>
      <div class="grid-4" id="stats-row"></div>
    </div>
    <div class="section">
      <div class="output-header">
        <p class="section-label" style="margin:0;">Zipline Message</p>
        <div class="btn-row">
          <button class="secondary" id="copy-btn">Copy</button>
          <button class="secondary" id="save-btn">Save to Google Sheets</button>
        </div>
      </div>
      <div class="message-box" id="msg-out"></div>
    </div>
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <p class="section-label" style="margin:0;">Debug Log</p>
        <button class="secondary" onclick="document.getElementById('debug-out').innerHTML=''" style="padding:4px 10px;font-size:11px;">Clear</button>
      </div>
      <div class="debug-box" id="debug-out">Generate a report to see debug info.</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // ── Config ─────────────────────────────────────────────────────
  // Read via public CSV export (no CORS, no auth needed)
  var SHEET_ID  = '1lW2DOT0jwcB63YnhSuNHhKDo8bUotl__aLlmBemhOGA';
  var SHEET_GID = '913698334';
  var CSV_URL   = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
                  '/export?format=csv&gid=' + SHEET_GID;

  // Save via Apps Script POST
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHG57s8DBEYaq4tXwiYnmQ0f1zdeyuqMpgzItPPKRJm-GYiEfseObTNMR_xYaC5t4q/exec';

  var closingData = null;
  var feeData     = null;
  var sheetRows   = []; // parsed CSV rows: [{date, netSales, atv, ...}]

  // ── Debug ──────────────────────────────────────────────────────
  function dbg(msg, cls) {
    var box = document.getElementById('debug-out');
    if (!box) return;
    if (box.textContent === 'Generate a report to see debug info.') box.innerHTML = '';
    var s = document.createElement('span');
    if (cls) s.className = cls;
    s.textContent = msg;
    box.appendChild(s);
    box.appendChild(document.createTextNode('\n'));
    box.scrollTop = box.scrollHeight;
  }

  function toast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast ' + (type || 'success');
    el.style.display = 'block';
    setTimeout(function(){ el.style.display='none'; }, 4000);
  }

  // ── Formatting helpers ─────────────────────────────────────────
  function fmt$(n) {
    return '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function fmtGoal(n) {
    n = Number(n);
    if (n>=1000000) return '$'+(n/1000000).toFixed(1)+'M';
    if (n>=1000)    return '$'+Math.round(n/1000)+'K';
    return '$'+n;
  }
  function delta(current, last) {
    if (!last||isNaN(last)||last===0) return null;
    var d = ((current-last)/last*100).toFixed(1);
    return (d>=0?'+':'')+d+'%';
  }
  function pad2(n){ return String(n).padStart(2,'0'); }

  // Normalize any date to MM/DD/YYYY
  function toDateStr(val) {
    if (!val && val!==0) return '';
    if (val instanceof Date) {
      if (isNaN(val.getTime())) return '';
      return pad2(val.getMonth()+1)+'/'+pad2(val.getDate())+'/'+val.getFullYear();
    }
    if (typeof val==='number') {
      var dt = new Date(Math.round((val-25569)*86400*1000));
      dt = new Date(dt.getTime()+dt.getTimezoneOffset()*60000);
      return pad2(dt.getMonth()+1)+'/'+pad2(dt.getDate())+'/'+dt.getFullYear();
    }
    var s = String(val).trim();
    var iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return iso[2]+'/'+iso[3]+'/'+iso[1];
    var sl = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (sl) return pad2(parseInt(sl[1]))+'/'+pad2(parseInt(sl[2]))+'/'+sl[3];
    return s;
  }

  // ── CSV parser (handles quoted fields with commas/newlines) ────
  function parseCSV(text) {
    var rows = [], cur = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i], nx = text[i+1];
      if (inQ) {
        if (ch==='"' && nx==='"') { field+='"'; i++; }
        else if (ch==='"') { inQ=false; }
        else { field+=ch; }
      } else {
        if (ch==='"') { inQ=true; }
        else if (ch===',') { cur.push(field); field=''; }
        else if (ch==='\r'&&nx==='\n') { cur.push(field); rows.push(cur); cur=[]; field=''; i++; }
        else if (ch==='\n'||ch==='\r') { cur.push(field); rows.push(cur); cur=[]; field=''; }
        else { field+=ch; }
      }
    }
    if (field||cur.length) { cur.push(field); rows.push(cur); }
    return rows;
  }

  // ── Load sheet data via public CSV export ──────────────────────
  function loadSheetData() {
    dbg('Fetching sheet data via CSV export...');
    // Add cache-buster so we always get fresh data
    var url = CSV_URL + '&cachebust=' + Date.now();
    return fetch(url)
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function(csv) {
        var rows = parseCSV(csv);
        dbg('CSV rows received: ' + rows.length, 'dok');
        if (rows.length < 2) { dbg('Sheet appears empty.','dwarn'); return; }

        // Row 0 is header; rows 1+ are data
        // Columns: Date(0), NetSales(1), NetSalesLW(2), ATV(3), ATVLW(4), ...
        sheetRows = rows.slice(1).map(function(r) {
          return {
            date:       toDateStr(r[0]),
            netSales:   parseFloat(r[1]) || 0,
            netSalesLW: parseFloat(r[2]) || 0,
            atv:        parseFloat(r[3]) || 0,
            atvLW:      parseFloat(r[4]) || 0
          };
        }).filter(function(r){ return r.date; });

        dbg('Parsed ' + sheetRows.length + ' data rows.', 'dok');
        sheetRows.forEach(function(r, i) {
          dbg('  ['+i+'] date="'+r.date+'" netSales='+r.netSales+' atv='+r.atv);
        });
      })
      .catch(function(e) {
        dbg('CSV fetch error: ' + e.message, 'derr');
      });
  }

  // ── Last-week lookup ───────────────────────────────────────────
  function findLastWeekRow(targetDate) {
    dbg('--- Last-Week Lookup ---');
    dbg('Report date: "' + targetDate + '"');

    if (!sheetRows.length) {
      dbg('No sheet rows loaded.', 'derr');
      return null;
    }

    var d = new Date(targetDate);
    if (isNaN(d.getTime())) {
      dbg('Cannot parse date.', 'derr');
      return null;
    }
    d.setDate(d.getDate() - 7);
    var lwStr = pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) + '/' + d.getFullYear();
    dbg('Searching for: "' + lwStr + '"');

    for (var i = 0; i < sheetRows.length; i++) {
      if (sheetRows[i].date === lwStr) {
        dbg('MATCH: netSales='+sheetRows[i].netSales+'  atv='+sheetRows[i].atv, 'dok');
        return { netSales: sheetRows[i].netSales, atv: sheetRows[i].atv };
      }
    }
    dbg('No match for "' + lwStr + '". That date is not in the sheet yet.', 'dwarn');
    return null;
  }

  // ── Save via Apps Script (no-cors form POST) ───────────────────
  function saveToSheet(payload) {
    return new Promise(function(resolve) {
      dbg('Saving via form POST to Apps Script...');

      var iframe = document.createElement('iframe');
      iframe.name = 'save_frame_' + Date.now();
      iframe.style.cssText = 'display:none;';
      document.body.appendChild(iframe);

      var form = document.createElement('form');
      form.method = 'POST';
      form.action = APPS_SCRIPT_URL;
      form.target = iframe.name;
      form.style.display = 'none';

      Object.keys(payload).forEach(function(key) {
        var inp = document.createElement('input');
        inp.type = 'hidden';
        inp.name = key;
        inp.value = String(payload[key]);
        form.appendChild(inp);
      });

      document.body.appendChild(form);
      form.submit();
      dbg('Form submitted. Waiting 4s for Apps Script to process...');

      setTimeout(function() {
        try { document.body.removeChild(form); } catch(e){}
        try { document.body.removeChild(iframe); } catch(e){}
        resolve();
      }, 4000);
    });
  }

  // ── XLSX readers ───────────────────────────────────────────────
  function readXlsx(file, cb) {
    var r = new FileReader();
    r.onload = function(e) {
      try { cb(null, XLSX.read(e.target.result,{type:'array',cellDates:true})); }
      catch(err){ cb(err); }
    };
    r.readAsArrayBuffer(file);
  }

  function parseClosing(wb) {
    var ws = wb.Sheets['Overview'];
    if (!ws) throw new Error('No Overview sheet in closing report');
    var data = XLSX.utils.sheet_to_json(ws);
    var row = data[0];
    if (!row) throw new Error('No data in Overview sheet');
    var ws2 = wb.Sheets['Payments'];
    var inStore=0, delivery=0;
    if (ws2) {
      XLSX.utils.sheet_to_json(ws2).forEach(function(r){
        if (r['isDelivery']==='Yes') delivery++; else inStore++;
      });
    }
    var dateStr = toDateStr(row['PosDate']);
    dbg('Closing report date parsed: "' + dateStr + '"');
    return {
      netSales: row['NetSales']||0, atv: row['AvgPerCart']||0,
      inStore:inStore, delivery:delivery, total:inStore+delivery,
      date: dateStr
    };
  }

  function parseFees(wb) {
    var ws = wb.Sheets['Report'];
    if (!ws) throw new Error('No Report sheet in fee/donation file');
    var data = XLSX.utils.sheet_to_json(ws,{header:1});
    var hi=-1;
    for (var i=0;i<data.length;i++){
      if (data[i]&&data[i].indexOf('FeeDonationName')!==-1){hi=i;break;}
    }
    if (hi===-1) throw new Error('Could not find headers in fee/donation report');
    var hdrs=data[hi], feeCol=hdrs.indexOf('FeeDonationName'), budCol=hdrs.indexOf('Budtender');
    var ffCount=0, seen={}, buds=[];
    for (var j=hi+1;j<data.length;j++){
      var row=data[j];
      if (!row||!row[feeCol]) continue;
      if (String(row[feeCol]).indexOf('Frequent Flyer')!==-1){
        ffCount++;
        var name=(row[budCol]||'').replace(/\s*DTBK\s*/gi,'').trim();
        if (name&&!seen[name]){seen[name]=true;buds.push(name);}
      }
    }
    return {ffCount:ffCount, ffBudtenders:buds};
  }

  // ── Build message ──────────────────────────────────────────────
  function buildMessage(c, f, lw) {
    var weekly   = document.getElementById('weekly-goal').value||580000;
    var daily    = document.getElementById('daily-goal').value||60000;
    var shoutouts= document.getElementById('field-shoutouts').value.trim();
    var focus    = document.getElementById('field-focus').value.trim();
    var inventory= document.getElementById('field-inventory').value.trim();
    var cash     = document.getElementById('field-cash').value.trim();

    var shoutoutLines=[];
    if (f.ffBudtenders.length>0)
      shoutoutLines.push('Shout out to '+f.ffBudtenders.join(' and ')+' for signing up Frequent Flyer members!! Great Job!!!');
    if (shoutouts) shoutoutLines.push('Shout out to '+shoutouts+'!! Great Job!!!');
    if (!shoutoutLines.length) shoutoutLines.push('No shoutouts today.');

    var lwNet='[Add from last week]', lwAtv='[Add from last week]';
    if (lw && lw.netSales) {
      var dNet=delta(c.netSales,lw.netSales);
      lwNet=fmt$(lw.netSales)+(dNet?' (\u0394 '+dNet+')':'');
    }
    if (lw && lw.atv) {
      var dAtv=delta(c.atv,lw.atv);
      lwAtv=fmt$(lw.atv)+(dAtv?' (\u0394 '+dAtv+')':'');
    }

    var msg='Sales Recap\n';
    msg+="Yesterday's Sales: "+fmt$(c.netSales)+'\n';
    msg+='Same Day Last Week: '+lwNet+'\n';
    msg+='Weekly Goal: '+fmtGoal(weekly)+'\n';
    msg+="Today's Goal: "+fmtGoal(daily)+'\n\n';
    msg+='Performance Metrics\n';
    msg+="Yesterday's Frequent Flyer Count: "+f.ffCount+'\n';
    msg+='ATV (Yesterday): '+fmt$(c.atv)+'\n';
    msg+='ATV (Last Week): '+lwAtv+'\n\n';
    msg+='Transactions Yesterday:\n';
    msg+='In-Store: '+c.inStore+'\n';
    msg+='Delivery: '+c.delivery+'\n';
    msg+='Total: '+c.total+'\n\n';
    msg+='Team Shoutouts\n'+shoutoutLines.join('\n')+'\n\n';
    msg+='Focus Areas\n'+focus+'\n\n';
    msg+='Inventory Updates\n'+inventory+'\n\n';
    msg+='Cash Updates\n'+cash;
    return msg;
  }

  function renderStats(c, f, lw) {
    var lwNet=(lw&&lw.netSales)?fmt$(lw.netSales):'—';
    var lwAtv=(lw&&lw.atv)?fmt$(lw.atv):'—';
    var dNet=lw?delta(c.netSales,lw.netSales):null;
    var dAtv=lw?delta(c.atv,lw.atv):null;
    document.getElementById('stats-row').innerHTML=[
      {label:'Net Sales',      value:fmt$(c.netSales), sub:dNet?'vs '+lwNet+' ('+dNet+')':'last week: '+lwNet},
      {label:'ATV',            value:fmt$(c.atv),      sub:dAtv?'vs '+lwAtv+' ('+dAtv+')':'last week: '+lwAtv},
      {label:'Transactions',   value:c.total,          sub:c.inStore+' in-store / '+c.delivery+' delivery'},
      {label:'Frequent Flyers',value:f.ffCount,        sub:f.ffBudtenders.length?f.ffBudtenders.join(', '):'none today'}
    ].map(function(s){
      return '<div class="stat-card"><div class="stat-label">'+s.label+'</div>'+
             '<div class="stat-val">'+s.value+'</div>'+
             '<div class="stat-sub">'+s.sub+'</div></div>';
    }).join('');
  }

  function checkReady() {
    document.getElementById('generate-btn').disabled=!(closingData&&feeData);
  }

  // ── File uploads ───────────────────────────────────────────────
  document.getElementById('cr-input').addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file) return;
    readXlsx(file,function(err,wb){
      if(err){toast('Error reading closing report','error');return;}
      try{
        closingData=parseClosing(wb);
        document.getElementById('cr-name').textContent=file.name;
        document.getElementById('cr-zone').classList.add('done');
        checkReady();
      } catch(ex){toast(ex.message,'error');}
    });
  });

  document.getElementById('fd-input').addEventListener('change',function(e){
    var file=e.target.files[0]; if(!file) return;
    readXlsx(file,function(err,wb){
      if(err){toast('Error reading fee/donation report','error');return;}
      try{
        feeData=parseFees(wb);
        document.getElementById('fd-name').textContent=file.name;
        document.getElementById('fd-zone').classList.add('done');
        checkReady();
      } catch(ex){toast(ex.message,'error');}
    });
  });

  // ── Generate ───────────────────────────────────────────────────
  document.getElementById('generate-btn').addEventListener('click',function(){
    if(!closingData||!feeData) return;
    var btn=document.getElementById('generate-btn');
    btn.disabled=true; btn.textContent='Loading sheet data...';
    document.getElementById('output').style.display='block';

    loadSheetData().then(function(){
      var lw=findLastWeekRow(closingData.date);
      var msg=buildMessage(closingData,feeData,lw);
      var box=document.getElementById('msg-out');
      box.innerHTML='';
      var headers=['Sales Recap','Performance Metrics','Transactions Yesterday:',
                   'Team Shoutouts','Focus Areas','Inventory Updates','Cash Updates'];
      msg.split('\n').forEach(function(line){
        var span=document.createElement('span');
        if(headers.indexOf(line)!==-1) span.className='message-section-header';
        span.textContent=line;
        box.appendChild(span);
        box.appendChild(document.createTextNode('\n'));
      });
      renderStats(closingData,feeData,lw);
      document.getElementById('output').scrollIntoView({behavior:'smooth',block:'start'});
      btn.disabled=false; btn.textContent='Generate Zipline Message';
    });
  });

  // ── Copy ───────────────────────────────────────────────────────
  document.getElementById('copy-btn').addEventListener('click',function(){
    navigator.clipboard.writeText(document.getElementById('msg-out').innerText)
      .then(function(){toast('Copied!');});
  });

  // ── Save ───────────────────────────────────────────────────────
  document.getElementById('save-btn').addEventListener('click',function(){
    if(!closingData||!feeData) return;

    var shoutouts=document.getElementById('field-shoutouts').value.trim();
    if(feeData.ffBudtenders.length>0){
      var ffLine='Shout out to '+feeData.ffBudtenders.join(' and ')+' for Frequent Flyer signups';
      shoutouts=shoutouts?ffLine+'; '+shoutouts:ffLine;
    }

    var lw=findLastWeekRow(closingData.date);
    var payload={
      date:           closingData.date,
      netSales:       closingData.netSales,
      netSalesLastWeek: lw ? lw.netSales : '',
      atv:            Math.round(closingData.atv*100)/100,
      atvLastWeek:    lw ? lw.atv : '',
      inStore:        closingData.inStore,
      delivery:       closingData.delivery,
      total:          closingData.total,
      ffCount:        feeData.ffCount,
      shoutouts:      shoutouts,
      focus:          document.getElementById('field-focus').value.trim(),
      inventory:      document.getElementById('field-inventory').value.trim(),
      cash:           document.getElementById('field-cash').value.trim()
    };

    dbg('--- Save ---');
    dbg('date='+payload.date+'  netSales='+payload.netSales+'  atv='+payload.atv);

    var btn=document.getElementById('save-btn');
    btn.disabled=true; btn.textContent='Saving...';

    saveToSheet(payload).then(function(){
      toast('Saved to Google Sheets!');
      dbg('Save submitted. Check your sheet to confirm the new row appeared.','dok');
      // Add to local cache so same-session lookup works immediately
      sheetRows.push({
        date: payload.date,
        netSales: payload.netSales,
        atv: payload.atv
      });
    }).finally(function(){
      btn.disabled=false; btn.textContent='Save to Google Sheets';
    });
  });

  // Pre-load on open
  loadSheetData();
</script>
</body>
</html>
